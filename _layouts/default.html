<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ page.title | escape }} · {{ site.title | escape }}</title><meta name="description" content="{{ page.description | default: site.description | escape }}"><link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}"></head>
<body{% if page.home %} class="home"{% endif %}><header><a class="brand" href="{{ '/' | relative_url }}">{{ site.title | escape }}<span>Notes & Ideas</span></a><nav aria-label="主导航"><a href="{{ '/search/' | relative_url }}">搜索</a><a href="{{ '/' | relative_url }}">文章</a><a href="{{ '/categories/' | relative_url }}">分类</a><a href="{{ '/about/' | relative_url }}">关于</a><a href="https://github.com/yuuuuuhhha">GitHub ↗</a></nav></header>{% if page.home %}<section class="hero" aria-label="博客封面"><div class="hero-title"><p>WELCOME TO MY LITTLE WORLD</p><h1>{{ site.title | escape }}</h1><div class="type-line"><span id="typed-text">主体性</span><span class="cursor" aria-hidden="true">|</span></div></div><a class="scroll-down" href="#posts" aria-label="浏览文章">⌄</a></section>{% endif %}<main>{{ content }}</main><footer>© {{ site.time | date: '%Y' }} {{ site.author | escape }} · 保持好奇，慢慢积累。</footer><script src="{{ '/assets/blog.js' | relative_url }}" defer></script></body></html>
